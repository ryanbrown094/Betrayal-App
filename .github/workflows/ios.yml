name: iOS app

# Builds the app on one of GitHub's Macs, checks its model against a game recorded from the real rules engine, and runs
# it in the simulator: recorded moments (-demo), every moment drawn offscreen (-render-all), and a game against bots on
# a local Worker, the app playing the host. The Worker is the game server's repo (ryanbrown094/Betrayal-Website), checked out
# with the SERVER_REPO_TOKEN secret (README → Checks); without it, the game against bots is skipped. The pictures go to
# the run's "ios-native-screens" artifact, and as one commit to refs/screens/ios-native (not a branch), for a session
# that can reach git but not the artifact store:  git fetch origin refs/screens/ios-native
# Mac minutes count ten times against the account's Actions allowance, so it runs on pushes that change the app, or by hand.
on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      full:
        description: "Play the whole game against bots, not just the first round (about four minutes more)"
        type: boolean
        default: false
      server:
        description: "The server repo's branch to play against"
        type: string
        default: main
      qa:
        description: "QA: a whole game hosted on a small iPhone, and one as a guest on a large one with bigger text, every screen photographed"
        type: boolean
        default: false
      airplay:
        description: "AirPlay: a practice game on the phone with the TV on a second display, the app's main thread sampled if it hangs (nothing else runs)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # the pictures' ref (the last step)
    env:
      APP: uk.co.thebetrayal.app
      SERVER_TOKEN: ${{ secrets.SERVER_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: The game server
        if: env.SERVER_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ryanbrown094/Betrayal-Website
          ref: ${{ inputs.server || 'main' }}
          token: ${{ secrets.SERVER_REPO_TOKEN }}
          path: server

      - name: Xcode
        run: xcodebuild -version

      - name: The model reads every recorded moment
        run: |
          swiftc TheBetrayal/Model/JSON.swift TheBetrayal/Model/Snapshot.swift TheBetrayal/Model/Logic.swift TheBetrayal/Model/API.swift TheBetrayal/UI/Art.swift ci/main.swift -o decode
          ./decode TheBetrayal/Debug/Fixtures.json

      - name: The recorded game is the server's current rules
        if: env.SERVER_TOKEN != ''
        run: |
          SERVER=server node tools/fixtures.mjs > fixtures-now.json
          cmp -s fixtures-now.json TheBetrayal/Debug/Fixtures.json || echo "::warning::The server's rules engine has changed since TheBetrayal/Debug/Fixtures.json was recorded: run node tools/fixtures.mjs > TheBetrayal/Debug/Fixtures.json and check the app's screens"

      - name: Build (Debug)
        run: >
          xcodebuild -quiet -project TheBetrayal.xcodeproj -scheme TheBetrayal -configuration Debug
          -destination "generic/platform=iOS Simulator" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Boot the simulator
        run: |
          set -eo pipefail
          # the newest iOS runtime's first iPhone
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if ".iOS-" in k), key=lambda k: [int(x) for x in k.split(".iOS-")[1].split("-")])
          print(next(x["udid"] for k in reversed(ios) for x in d[k] if x["name"].startswith("iPhone")))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/TheBetrayal.app
          mkdir -p shots/render

      - name: Recorded moments in the simulator
        if: ${{ !inputs.airplay }}
        run: |
          shot() {
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" "$APP" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$APP" "$@" > /dev/null
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$name.png" > /dev/null
          }
          shot 00-home 6
          shot 01-art 4 -art
          shot 02-home-host 6 -shop -screen host
          shot 03-home-passes 6 -shop -screen passes
          shot 03-review-passes 6 -shop -nosaved -screen passes
          shot 04-bought 4 -bought
          for p in rules faq terms privacy; do shot "05-page-$p" 4 -page "$p"; done
          shot 06-home-join 6 -screen join
          shot 06-home-tv 6 -screen tv
          for i in 0 1 2 3 4; do shot "07-intro-$i" 3 -intro "$i"; done
          for d in lobby-host oath roles-veil roles-forsworn day-host trial-intro-forsworn quiz-open quiz-reveal-host trial-done-winner \
                   word-open change-open snap-open truths-prep-teller talk-crown vote-mine reveal-words night-forsworn-picked \
                   dawn-revealed trust end-host day-host-tools; do
            shot "demo-$d" 3 -demo "$d"
          done

      - name: Every moment, drawn offscreen
        if: ${{ !inputs.qa }}
        run: |
          xcrun simctl terminate "$UDID" "$APP" 2>/dev/null || true
          xcrun simctl launch "$UDID" "$APP" -render-all > /dev/null
          DATA=$(xcrun simctl get_app_container "$UDID" "$APP" data)
          for i in $(seq 1 150); do [ -f "$DATA/Documents/shots/done" ] && break; sleep 2; done
          ls "$DATA/Documents/shots" | wc -l
          for f in "$DATA"/Documents/shots/*.png; do sips -s format jpeg -s formatOptions 70 "$f" --out "shots/render/$(basename "${f%.png}").jpg" > /dev/null; done

      - name: The App Store's pictures, drawn offscreen
        if: ${{ !inputs.qa && !inputs.airplay }}
        run: |
          xcrun simctl terminate "$UDID" "$APP" 2>/dev/null || true
          xcrun simctl launch "$UDID" "$APP" -render-store > /dev/null
          DATA=$(xcrun simctl get_app_container "$UDID" "$APP" data)
          for i in $(seq 1 60); do [ -f "$DATA/Documents/store/done" ] && break; sleep 2; done
          mkdir -p shots/store && cp "$DATA"/Documents/store/*.png shots/store/
          ls shots/store

      - name: A game against bots on a local Worker
        if: env.SERVER_TOKEN != '' && !inputs.airplay
        run: |
          cd server
          npm ci --no-audit --no-fund > /dev/null
          CI=true WRANGLER_SEND_METRICS=false npx wrangler dev --port 8790 --ip 127.0.0.1 --var ADMIN_TOKEN:dev --var MASTER_PASS:MASTERTEST --var SITE_PASSWORD: > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8790/ && break; sleep 2; done
          python3 ../ci/drive.py http://127.0.0.1:8790 MASTERTEST --rounds ${{ inputs.full && '0' || '1' }} \
            --launch "xcrun simctl terminate $UDID $APP 2>/dev/null; xcrun simctl launch $UDID $APP -server http://127.0.0.1:8790 -play {room} {tok} > /dev/null" \
            --shot "xcrun simctl io $UDID screenshot ../shots/{name}.png > /dev/null"

      # QA (by hand, with "qa"): the smallest iPhone (375 points wide) at the usual text size, and the big one with its
      # text two sizes larger; on each, the start screen's screens, then a whole game, every new screen photographed:
      # the small one hosting a practice game as someone on their own plays it, the big one a guest at a test game
      # (-noatt: the simulator can't answer Apple's tracking question)
      - name: QA, a whole game as the host on a small iPhone, as a guest on a large one with bigger text, and a stress game on an iPad TV
        if: env.SERVER_TOKEN != '' && inputs.qa
        run: |
          set -o pipefail
          # the last step's Worker, or a fresh one
          curl -sf -o /dev/null http://127.0.0.1:8790/ || { (cd server && CI=true WRANGLER_SEND_METRICS=false npx wrangler dev --port 8790 --ip 127.0.0.1 --var ADMIN_TOKEN:dev --var MASTER_PASS:MASTERTEST --var SITE_PASSWORD: > wrangler-qa.log 2>&1 &)
            for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8790/ && break; sleep 2; done; }
          RT=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          r = [x for x in json.load(sys.stdin)["runtimes"] if x["identifier"].split(".")[-1].startswith("iOS") and x["isAvailable"]]
          print(sorted(r, key=lambda x: [int(n) for n in x["version"].split(".")])[-1]["identifier"])')
          SMALL=$(xcrun simctl create qa-small com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$RT" 2>/dev/null \
            || xcrun simctl create qa-small com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini "$RT")
          xcrun simctl boot "$SMALL"; xcrun simctl bootstatus "$SMALL" -b
          xcrun simctl status_bar "$SMALL" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$SMALL" build/Build/Products/Debug-iphonesimulator/TheBetrayal.app
          xcrun simctl ui "$UDID" content_size extra-extra-large || echo "::warning::couldn't set the big phone's text size"
          # an iPad as the TV, for a stress game: a full Table of 24 (seven bots and seventeen scripted phones), with
          # the night's trouble (ci/stress.py --chaos), photographed at each new screen
          IPAD=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          t = [x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if "iPad-Pro" in x["identifier"] and "13" in x["identifier"]]
          print(t[-1] if t else "")')
          TV=$(xcrun simctl create qa-tv "$IPAD" "$RT" 2>/dev/null) || echo "::warning::no iPad simulator for the TV"
          [ -n "$TV" ] && { xcrun simctl boot "$TV"; xcrun simctl bootstatus "$TV" -b; xcrun simctl install "$TV" build/Build/Products/Debug-iphonesimulator/TheBetrayal.app; }
          mkdir -p shots/qa-small shots/qa-big shots/qa-tv
          for d in small:$SMALL big:$UDID; do
            name=${d%%:*}; dev=${d#*:}
            snap() { xcrun simctl terminate "$dev" "$APP" 2>/dev/null || true; xcrun simctl launch "$dev" "$APP" "${@:2}" > /dev/null; sleep 5; xcrun simctl io "$dev" screenshot "shots/qa-$name/00-$1.png" > /dev/null; }
            snap home; snap join -screen join; snap tv -screen tv; snap host -shop -screen host; snap passes -shop -screen passes; snap intro -intro 0; snap faq -page faq
          done
          cd server
          # the small phone hosts a practice game; the big one is a guest's phone at a test game (the host played by the script)
          for d in small:$SMALL big:$UDID; do
            name=${d%%:*}; dev=${d#*:}; how=$([ "$name" = small ] && echo --practice || echo --guest)
            python3 ../ci/drive.py http://127.0.0.1:8790 MASTERTEST $how --prefix "" --limit 1800 \
              --launch "xcrun simctl terminate $dev $APP 2>/dev/null; xcrun simctl launch $dev $APP -server http://127.0.0.1:8790 -noatt -adclose -play {room} {tok} > /dev/null" \
              --shot "xcrun simctl io $dev screenshot ../shots/qa-$name/{name}.png > /dev/null" > ../shots/qa-$name/drive.log 2>&1 &
          done
          if [ -n "$TV" ]; then
            python3 ../ci/stress.py http://127.0.0.1:8790 --players 24 --chaos --master MASTERTEST --test --limit 1500 \
              --launch "xcrun simctl launch $TV $APP -server http://127.0.0.1:8790 -watch {room} > /dev/null" \
              --shot "xcrun simctl io $TV screenshot ../shots/qa-tv/{name}.png > /dev/null" > ../shots/qa-tv/stress.log 2>&1 &
          fi
          wait
          tail -n 3 ../shots/qa-*/drive.log
          sed -n '/^== requests/,$p' ../shots/qa-tv/stress.log 2>/dev/null || true
          for f in ../shots/qa-tv/*.png; do [ -f "$f" ] && sips -s format jpeg -s formatOptions 60 "$f" --out "${f%.png}.jpg" > /dev/null && rm "$f"; done # (an iPad's screens are big)
          # each Table's device log, as /admin shows it: every device, and what kinds of event each sent
          for name in small big; do
            room=$(awk '/^room /{print $2; exit}' ../shots/qa-$name/drive.log)
            curl -s -H "Authorization: Bearer dev" "http://127.0.0.1:8790/api/admin/room/$room/events" > ../shots/qa-$name/events.json
            python3 -c '
          import collections, json, sys
          ev = json.load(open(sys.argv[1])).get("events", [])
          devs = collections.defaultdict(collections.Counter)
          for e in ev: devs[(e.get("device"), e.get("role"), e.get("app"))][e.get("k")] += 1
          print(sys.argv[2], len(devs), "devices,", len(ev), "events")
          for d, c in devs.items(): print("  ", d, dict(c))' ../shots/qa-$name/events.json "$name $room"
          done

      # AirPlay (by hand, with "airplay"): first the simulator's own second display (its menu, clicked by
      # ci/external.applescript), and what the app makes of it; then the phone hosts a whole practice game with the TV's
      # session in its process, its sound on, as an AirPlayed phone runs it: on that display, or else drawn at 1080p in
      # the phone's corner (-twin). The app touches a file from its main thread twice a second (-heartbeat); when that
      # stops for five seconds, the app is sampled (every thread's stack) and photographed. (An iPhone's main thread
      # has 1 MB of stack, a Mac's, where the simulator runs, 8 MB: a stack overflow on a phone may not show here.)
      - name: AirPlay, a practice game with the TV on a second display, watched for a hang
        if: env.SERVER_TOKEN != '' && inputs.airplay
        run: |
          OUT=$PWD/shots/airplay
          mkdir -p "$OUT"
          cd server
          npm ci --no-audit --no-fund > /dev/null
          (CI=true WRANGLER_SEND_METRICS=false npx wrangler dev --port 8790 --ip 127.0.0.1 --var ADMIN_TOKEN:dev --var MASTER_PASS:MASTERTEST --var SITE_PASSWORD: > wrangler.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8790/ && break; sleep 2; done
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 15
          osascript ../ci/external.applescript 2>&1 | tee "$OUT/menu.txt" || true
          sleep 5
          # what the app makes of the second display: its [TV] notes, and the Mac's screen with the Simulator's windows
          xcrun simctl launch --stdout="$OUT/probe-out.log" --stderr="$OUT/probe-err.log" "$UDID" "$APP" > /dev/null
          sleep 10
          screencapture -x "$OUT/00-mac.png" 2>&1 || echo "no screencapture"
          xcrun simctl io "$UDID" screenshot --display=external "$OUT/00-external.png" > /dev/null 2>&1 || echo "no external display to photograph"
          xcrun simctl terminate "$UDID" "$APP" 2>/dev/null || true
          echo "== the app's [TV] notes:"; cat "$OUT/probe-out.log"
          # the game, the TV's session in the phone's process with its sound, as an AirPlayed phone runs it: on the second
          # display if the app drew its TV there, or else drawn at 1080p in the phone's corner (-twin)
          TWIN=-twin
          shot="xcrun simctl io $UDID screenshot $OUT/{name}.png > /dev/null"
          if grep -q "second display connected" "$OUT/probe-out.log"; then
            TWIN=""; shot="$shot; xcrun simctl io $UDID screenshot --display=external $OUT/{name}-tv.png > /dev/null 2>&1"
            echo "the TV is on the second display"
          else echo "::warning::the app didn't draw its TV on the second display: the game draws it in the phone's corner (-twin)"; fi
          DATA=$(xcrun simctl get_app_container "$UDID" "$APP" data)
          rm -f "$DATA/Documents/heartbeat"
          python3 ../ci/drive.py http://127.0.0.1:8790 MASTERTEST --practice --prefix "" --limit 1500 \
            --launch "xcrun simctl terminate $UDID $APP 2>/dev/null; xcrun simctl launch --stdout=$OUT/app-out.log --stderr=$OUT/app-err.log $UDID $APP -server http://127.0.0.1:8790 -noatt -adclose -heartbeat $TWIN -play {room} {tok} > /dev/null" \
            --shot "$shot" > "$OUT/drive.log" 2>&1 &
          DRIVE=$!
          hangs=0
          while kill -0 $DRIVE 2>/dev/null; do
            sleep 1
            hb="$DATA/Documents/heartbeat"; [ -f "$hb" ] || continue
            age=$(( $(date +%s) - $(stat -f %m "$hb") ))
            [ "$age" -lt 5 ] && continue
            PID=$(pgrep -f "TheBetrayal.app/TheBetrayal" | head -1); [ -n "$PID" ] || continue
            hangs=$((hangs + 1))
            echo "::warning::the app's main thread has been stuck for ${age}s (hang $hangs)"
            tail -n 2 "$OUT/drive.log"
            ps -o pid,%cpu,rss,etime -p "$PID" | tee "$OUT/hang-$hangs-ps.txt"
            xcrun simctl io "$UDID" screenshot "$OUT/hang-$hangs.png" > /dev/null 2>&1 || true
            [ -z "$TWIN" ] && { xcrun simctl io "$UDID" screenshot --display=external "$OUT/hang-$hangs-tv.png" > /dev/null 2>&1 || true; }
            sample "$PID" 5 -file "$OUT/hang-$hangs-sample.txt" > /dev/null 2>&1 || sudo -n sample "$PID" 5 -file "$OUT/hang-$hangs-sample.txt" > /dev/null 2>&1 || echo "couldn't sample the app"
            awk '/com.apple.main-thread/{p=1; print; next} p && /Thread_[0-9]/{exit} p' "$OUT/hang-$hangs-sample.txt" 2>/dev/null | cut -c1-240 | head -150
            ps -o pid,%cpu,rss,etime -p "$PID" | tail -n 1
            [ $hangs -ge 3 ] && { kill $DRIVE; break; }
            sleep 20
          done
          wait $DRIVE || true
          cat "$OUT/drive.log"
          [ $hangs -eq 0 ] && echo "no hang: the main thread kept ticking all game"
          grep "^\[TV\]" "$OUT/app-out.log" || echo "no [TV] notes in the game"
          tail -n 20 "$OUT/app-err.log" 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 20m --style compact --predicate 'process == "TheBetrayal"' > "$OUT/device.log" 2>&1 || true
          grep -i "hang\|AVAudio\|fault" "$OUT/device.log" | tail -n 40 || true

      - name: Build (Release)
        if: ${{ !inputs.airplay }}
        run: >
          xcodebuild -quiet -project TheBetrayal.xcodeproj -scheme TheBetrayal -configuration Release
          -destination "generic/platform=iOS Simulator" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-screens
          path: shots/

      - name: The pictures as a git ref
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          cp server/wrangler.log shots/ 2>/dev/null || true
          cd shots && git init -q && git add -A
          git -c user.name="iOS CI" -c user.email="ci@users.noreply.github.com" commit -qm "iOS native screens for $GITHUB_SHA (run $GITHUB_RUN_ID)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/screens/ios-native
          echo "refs/screens/ios-native → $(git rev-parse HEAD)"
