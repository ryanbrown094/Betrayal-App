name: App Store version, ready to submit

# The version that can still be edited: its version number, its build and App Review's notes (ci/asc_prepare.py),
# with the upload's API key; it never submits. By hand, or when the script changes on a push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number"
        default: "1.1"
      build:
        description: "Build number"
        default: "6"
  push:
    paths:
      - ci/asc_prepare.py

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Version number, build and App Review's notes
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ inputs.version || '1.1' }}
          BUILD: ${{ inputs.build || '6' }}
        run: |
          pip install --quiet "pyjwt[crypto]"
          python3 ci/asc_prepare.py
