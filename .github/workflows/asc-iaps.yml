name: App Store passes, put up for review

# The Night Pass and the Host Pass put up for review to go with the app's version (ci/asc_iaps.py), with the upload's
# API key: by hand, or when the script changes on a push.
on:
  workflow_dispatch:
  push:
    paths:
      - ci/asc_iaps.py

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: The passes, put up for review
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install --quiet "pyjwt[crypto]"
          python3 ci/asc_iaps.py
