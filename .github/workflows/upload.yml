name: Upload to App Store Connect

# Archives the app (Release) from the branch it's run on and uploads the build to App Store Connect, for when there's
# no Mac at hand. By hand only: Actions → Upload to App Store Connect → Run workflow, on main. Signing is Xcode's
# automatic signing through an App Store Connect API key with the Admin role (App Store Connect → Users and Access →
# Integrations → Team Keys), in three repository secrets: ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (the whole .p8
# file). The key is only ever written to the runner's home folder, which goes with the runner.
# The build is the project's version and build number (MARKETING_VERSION, CURRENT_PROJECT_VERSION): App Store Connect
# refuses a build number it already has. Once it has processed the build (it emails), pick it on the version's page.
on:
  workflow_dispatch:

concurrency:
  group: upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode, and the version this uploads
        run: |
          xcodebuild -version
          xcodebuild -project TheBetrayal.xcodeproj -scheme TheBetrayal -configuration Release -showBuildSettings 2>/dev/null \
            | grep -E "^ *(MARKETING_VERSION|CURRENT_PROJECT_VERSION|PRODUCT_BUNDLE_IDENTIFIER) ="

      - name: The API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$P8" ]; then
            echo "::error::Add the repository secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 first (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # where xcodebuild is pointed at it, and where altool looks for it by its id
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$P8" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          echo "KEY=$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild -quiet -project TheBetrayal.xcodeproj -scheme TheBetrayal -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/TheBetrayal.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            archive

      # Xcode's own upload (as Distribute App does); if it won't take the key for the upload, the .ipa exported and sent
      # with altool, which finds the key by its id
      - name: Upload
        run: |
          options() {
            cat > "$RUNNER_TEMP/$1.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$1</string>
            <key>teamID</key><string>9D6NQ54RZT</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          }
          export_to() {
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TheBetrayal.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/$1.plist" \
              -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
              -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          }
          options upload; options export
          if export_to upload; then echo "Uploaded. App Store Connect emails when it has processed the build."; exit 0; fi
          echo "::warning::Xcode's own upload didn't go through: exporting the .ipa and sending it with altool"
          export_to export
          xcrun altool --upload-app -f "$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Forget the key
        if: always()
        run: rm -rf ~/.appstoreconnect
