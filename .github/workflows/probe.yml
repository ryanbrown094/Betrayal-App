# Temporary: which Xcodes and iOS SDKs the Mac runners have, and whether an SDK has the iOS 27 external-display API
# (a scene accessory). Removed once read.
name: SDK probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - run: |
          ls -d /Applications/Xcode*.app
          xcrun simctl list runtimes | grep -i ios
          for x in /Applications/Xcode*.app; do
            [ -L "$x" ] && continue
            export DEVELOPER_DIR=$x/Contents/Developer
            sdk=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null) || continue
            echo "== $x · $(xcodebuild -version | tr '\n' ' ') · SDK $(xcrun --sdk iphoneos --show-sdk-version)"
            grep -rn -i "sceneaccessory" "$sdk/System/Library/Frameworks/UIKit.framework/Headers" | head -40
            grep -rln -i "sceneaccessory\|ExternalNonInteractiveAccessory" "$sdk/System/Library/Frameworks/SwiftUI.framework" "$sdk/System/Library/Frameworks/UIKit.framework" 2>/dev/null | head
            for f in $(grep -rl -i "ExternalNonInteractiveAccessory\|sceneAccessory" "$sdk/System/Library/Frameworks/SwiftUI.framework" --include=*.swiftinterface 2>/dev/null | head -1); do
              grep -n -i -B3 -A3 "ExternalNonInteractiveAccessory\|func sceneAccessory" "$f" | head -80
            done
            grep -rn -i -B2 -A6 "windowExternalDisplayNonInteractive" "$sdk/System/Library/Frameworks/UIKit.framework/Headers/UISceneDefinitions.h" | head -40
          done
