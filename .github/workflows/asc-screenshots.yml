name: App Store screenshots

# store/screenshots/ to App Store Connect, for the version that can still be edited (ci/asc_screenshots.py), with the
# upload's API key: by hand, or when the script changes on a push.
on:
  workflow_dispatch:
  push:
    paths:
      - ci/asc_screenshots.py

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The screenshots to App Store Connect
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install --quiet "pyjwt[crypto]" pillow
          python3 ci/asc_screenshots.py
